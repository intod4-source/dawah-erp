<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dawat ERP</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#f7f7f7}
#msg{padding:28px;font-size:18px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="msg">Loading Dawat ERP…</div>
<script>
(async()=>{
  try{
    const r=await fetch('https://cdidgehrcnapaqdxmhok.supabase.co/functions/v1/erp-app-source',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const source=await r.text();
    const m=source.match(/atob\("([A-Za-z0-9+/=]+)"\)/);
    if(!m) throw new Error('ERP bundle not found');

    const raw=atob(m[1]);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    if(typeof DecompressionStream!=='function') throw new Error('This browser does not support gzip decompression');

    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();

    // Do not let the optional Excel library block the login screen.
    html=html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/xlsx@0\.18\.5\/dist\/xlsx\.full\.min\.js">[\s\S]*?<\/script>/i,'');
    html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v8.css?v=9b40f0ea"></head>`);
    html=html.replace('</body>',`<script>setTimeout(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.async=true;document.head.appendChild(s);},1200);<\/script><script src="./ui-v8.js?v=52a58834"><\/script></body>`);

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    const el=document.getElementById('msg');
    if(el) el.textContent='ERP loading error: '+String(e);
  }
})();
</script>
<!-- executive-ui-v8 -->
</body>
</html>
