name: Build NazarVPN APK

on:
  push:
    branches: [nazarvpn-v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore NazarVPN V2 source
        run: base64 -d app/src/main/MainActivity.java.gz.b64 | gzip -d > app/src/main/java/com/nazarvpn/app/MainActivity.java
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK details
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: NazarVPN-V2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
