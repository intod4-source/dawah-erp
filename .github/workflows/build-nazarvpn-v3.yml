name: Build NazarVPN V5

on:
  push:
    branches: [nazarvpn-v5-global]
    paths-ignore:
      - 'v5-relays/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nazarvpn-v5-global
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.14904198" || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq swig cmake ninja-build curl
      - name: Checkout OpenVPN Android engine
        run: git clone --depth 1 --recurse-submodules https://github.com/schwabe/ics-openvpn.git engine
      - name: Refresh and validate VPN Gate snapshot
        run: |
          set -euo pipefail
          mkdir -p v5-relays
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 45 -A 'NazarVPN-V5-Build/5.0' 'https://www.vpngate.net/api/iphone/' -o v5-relays/vpngate.csv
          grep -q '^#HostName,IP,Score,Ping,Speed,CountryLong,CountryShort' v5-relays/vpngate.csv
          ROWS=$(grep -vcE '^\*|^#|^$' v5-relays/vpngate.csv)
          test "$ROWS" -ge 10
          echo "Validated $ROWS live relay rows"
          git config user.name 'NazarVPN Relay Bot'
          git config user.email 'nazarvpn-relay-bot@users.noreply.github.com'
          git add v5-relays/vpngate.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh NazarVPN relay snapshot'
            git push origin HEAD:nazarvpn-v5-global
          fi
      - name: Apply NazarVPN V5 branding and reliability changes
        run: |
          cp v4/NazarVPNActivity.java engine/main/src/ui/java/de/blinkt/openvpn/activities/NazarVPNActivity.java
          python3 - <<'PY'
          from pathlib import Path
          a=Path('engine/main/src/ui/java/de/blinkt/openvpn/activities/NazarVPNActivity.java')
          s=a.read_text()
          s=s.replace('import android.app.Activity;', 'import android.app.Activity;\nimport android.Manifest;', 1)
          s=s.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport android.os.Build;', 1)
          s=s.replace('import android.util.Base64;', 'import android.util.Base64;\nimport android.content.pm.PackageManager;', 1)
          s=s.replace('private static final String VPNGATE="https://www.vpngate.net/api/iphone/";', 'private static final String VPNGATE="https://raw.githubusercontent.com/intod4-source/dawah-erp/nazarvpn-v5-global/v5-relays/vpngate.csv";', 1)
          s=s.replace('NazarVPN/4.0 Android', 'NazarVPN/5.0 Android')
          s=s.replace('Fast auto-selection • Live relay quality • Optional account', 'Smart failover • Live relay health • Secure Android VPN')
          s=s.replace('Finding fastest server…', 'Checking available secure routes…')
          s=s.replace('Embedded OpenVPN / Android VpnService', 'OpenVPN engine • Android VpnService • Automatic relay fallback')
          s=s.replace('if(candidates.size()>=6)break;', 'if(candidates.size()>=10)break;', 1)
          s=s.replace('String ovpn=new String(Base64.decode(relay.config,Base64.DEFAULT),StandardCharsets.UTF_8);', 'String ovpn=new String(Base64.decode(relay.config,Base64.DEFAULT),StandardCharsets.UTF_8)+"\\nconnect-timeout 8\\nconnect-retry-max 1\\n";', 1)
          old='private void requestVpnPermission(){Intent i=VpnService.prepare(this);if(i!=null)startActivityForResult(i,REQ_VPN);else startPending();}'
          new='private void requestVpnPermission(){Intent i=VpnService.prepare(this);if(i==null){requestNotificationPermissionIfNeeded();startPending();return;}if(!prefs.getBoolean("vpn_permission_explained",false)){new AlertDialog.Builder(this).setTitle("Allow VPN connection").setMessage("Android requires your approval before NazarVPN can create a secure VPN tunnel. Tap Continue, then approve the Android VPN dialog. This is a system permission and NazarVPN cannot grant it silently.").setPositiveButton("Continue",(d,w)->{prefs.edit().putBoolean("vpn_permission_explained",true).apply();requestVpnPermissionActual();}).setNegativeButton("Cancel",(d,w)->failConnect("VPN permission is required to connect.")).show();}else requestVpnPermissionActual();} private void requestVpnPermissionActual(){Intent i=VpnService.prepare(this);if(i!=null)startActivityForResult(i,REQ_VPN);else{requestNotificationPermissionIfNeeded();startPending();}} private void requestNotificationPermissionIfNeeded(){if(Build.VERSION.SDK_INT>=33&&checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},502);}'
          if old not in s: raise SystemExit('VPN permission pattern not found')
          s=s.replace(old,new,1)
          s=s.replace('if(result==RESULT_OK)startPending();else failConnect("VPN permission is required.");', 'if(result==RESULT_OK){requestNotificationPermissionIfNeeded();startPending();}else failConnect("VPN permission is required.");', 1)
          a.write_text(s)

          p=Path('engine/main/src/ui/AndroidManifest.xml')
          m=p.read_text().replace('android:name=".activities.MainActivity"','android:name=".activities.NazarVPNActivity"',1)
          if 'android.permission.POST_NOTIFICATIONS' not in m:
              start=m.find('<manifest')
              pos=m.find('>',start)+1
              m=m[:pos]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'+m[pos:]
          p.write_text(m)

          p=Path('engine/main/build.gradle.kts')
          g=p.read_text().replace('defaultConfig {','defaultConfig {\n        applicationId = "com.nazarvpn.app"',1).replace('versionName = "0.7.64"','versionName = "5.0.0"',1)
          p.write_text(g)

          for f in Path('engine/main/src').rglob('strings.xml'):
              try:
                  t=f.read_text().replace('<string name="app">OpenVPN for Android</string>','<string name="app">NazarVPN</string>').replace('<string name="app_name">OpenVPN for Android</string>','<string name="app_name">NazarVPN</string>')
                  f.write_text(t)
              except Exception: pass

          gp=Path('engine/gradle.properties')
          txt=gp.read_text() if gp.exists() else ''
          lines=[ln for ln in txt.splitlines() if not ln.startswith('org.gradle.jvmargs=') and not ln.startswith('org.gradle.workers.max=')]
          lines += ['org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8','org.gradle.workers.max=2','org.gradle.parallel=false']
          gp.write_text('\n'.join(lines)+'\n')
          PY
      - name: Build universal APK and capture log
        run: |
          set +e
          cd engine
          ./gradlew :main:assembleUiOvpn23Debug --stacktrace --no-daemon > ../v5-build.log 2>&1
          CODE=$?
          cd ..
          echo "$CODE" > v5-build.exit
          tail -n 260 v5-build.log || true
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NazarVPN-V5-build-log
          path: |
            v5-build.log
            v5-build.exit
      - name: Fail if Gradle failed
        run: test "$(cat v5-build.exit)" = "0"
      - name: Collect and verify APK
        run: |
          APK=$(find engine/main/build/outputs/apk -type f -name '*universal*.apk' | head -n 1)
          if [ -z "$APK" ]; then APK=$(find engine/main/build/outputs/apk -type f -name '*.apk' | head -n 1); fi
          test -n "$APK"
          cp "$APK" NazarVPN_V5_GLOBAL.apk
          unzip -t NazarVPN_V5_GLOBAL.apk >/dev/null
          ls -lh NazarVPN_V5_GLOBAL.apk
          sha256sum NazarVPN_V5_GLOBAL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NazarVPN-V5-GLOBAL
          path: NazarVPN_V5_GLOBAL.apk
          if-no-files-found: error
