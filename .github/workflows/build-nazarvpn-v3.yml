name: Build NazarVPN V3

on:
  push:
    branches: [nazarvpn-v3-vpngate]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.14904198" || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq swig cmake ninja-build
      - name: Checkout OpenVPN Android engine
        run: git clone --depth 1 --recurse-submodules https://github.com/schwabe/ics-openvpn.git engine
      - name: Apply NazarVPN branding and UI
        run: |
          cp v3/NazarVPNActivity.java engine/main/src/ui/java/de/blinkt/openvpn/activities/NazarVPNActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/main/src/ui/AndroidManifest.xml')
          s=p.read_text().replace('android:name=".activities.MainActivity"','android:name=".activities.NazarVPNActivity"',1)
          p.write_text(s)
          p=Path('engine/main/build.gradle.kts')
          s=p.read_text().replace('defaultConfig {','defaultConfig {\n        applicationId = "com.nazarvpn.app"',1).replace('versionName = "0.7.64"','versionName = "3.0.0"',1)
          p.write_text(s)
          for f in Path('engine/main/src').rglob('strings.xml'):
              try:
                  t=f.read_text().replace('<string name="app">OpenVPN for Android</string>','<string name="app">NazarVPN</string>').replace('<string name="app_name">OpenVPN for Android</string>','<string name="app_name">NazarVPN</string>')
                  f.write_text(t)
              except Exception: pass
          PY
      - name: Build universal APK and capture log
        id: gradle_build
        run: |
          set +e
          cd engine
          ./gradlew :main:assembleUiOvpn23Debug --stacktrace --no-daemon > ../v3-build.log 2>&1
          CODE=$?
          cd ..
          echo "$CODE" > v3-build.exit
          tail -n 200 v3-build.log || true
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NazarVPN-V3-build-log
          path: |
            v3-build.log
            v3-build.exit
      - name: Fail if Gradle failed
        run: |
          test "$(cat v3-build.exit)" = "0"
      - name: Collect and verify APK
        run: |
          find engine/main/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find engine/main/build/outputs/apk -type f -name '*universal*.apk' | head -n 1)
          if [ -z "$APK" ]; then APK=$(find engine/main/build/outputs/apk -type f -name '*.apk' | head -n 1); fi
          test -n "$APK"
          cp "$APK" NazarVPN_V3_VPNGate.apk
          unzip -t NazarVPN_V3_VPNGate.apk >/dev/null
          ls -lh NazarVPN_V3_VPNGate.apk
          sha256sum NazarVPN_V3_VPNGate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NazarVPN-V3-VPNGate
          path: NazarVPN_V3_VPNGate.apk
          if-no-files-found: error
