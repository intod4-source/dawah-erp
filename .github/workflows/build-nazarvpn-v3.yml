name: Build NazarVPN V5

on:
  push:
    branches: [nazarvpn-v5-global]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.14904198" || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq swig cmake ninja-build curl
      - name: Checkout OpenVPN Android engine
        run: git clone --depth 1 --recurse-submodules https://github.com/schwabe/ics-openvpn.git engine
      - name: Download and validate relay snapshot
        run: |
          set -euo pipefail
          mkdir -p engine/main/src/ui/assets
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 45 -A 'NazarVPN-V5-Build/5.0' 'https://www.vpngate.net/api/iphone/' -o engine/main/src/ui/assets/nazarvpn_relays.csv
          grep -q '^#HostName,IP,Score,Ping,Speed,CountryLong,CountryShort' engine/main/src/ui/assets/nazarvpn_relays.csv
          ROWS=$(grep -vcE '^\*|^#|^$' engine/main/src/ui/assets/nazarvpn_relays.csv)
          test "$ROWS" -ge 10
          echo "Validated $ROWS relay rows for bundled fallback"
      - name: Apply NazarVPN V5 source patch
        run: python3 -c "import base64;exec(base64.b64decode('');"